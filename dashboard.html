    <style>
        :root {

            --primary-glow: rgba(59, 130, 246, 0.25);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --wa-green: #25d366;

        * {

            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {

            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
        }
        header {

            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }
        .brand h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }
        .actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .btn {

            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;

            text-decoration: none;

            border: none;

        .btn-whatsapp {

            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }
        .stats-grid {
            max-width: 1400px;
            margin: 0 auto 24px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }
        .stat-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);

        .stat-label {

            margin: 0 auto 24px auto;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 280px;
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: white;
            font-size: 14px;
            outline: none;

        .search-box:focus {

        }
        .filter-select {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: white;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        .leads-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }
        .lead-card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .lead-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }
        .lead-title {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            line-height: 1.3;
        }

            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;

            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .badge-warm {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(251, 191, 36, 0.12);
            color: #f59e0b;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 600;
        }
        .gaps-container {
            margin: 12px 0 18px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .gap-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }
        .btn-card {
            flex: 1;
            text-align: center;
            justify-content: center;
            font-size: 13px;
            padding: 8px 12px;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

            background: rgba(255, 255, 255, 0.12);
        }
        .toast {

            right: 24px;
            background: var(--surface);
            border: 1px solid var(--success);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);

d team—it speaks volumes about her true character.\nThank you, Dr. Shruti and team, for taking such great care of our smiles. Highly recommended!", "text_translated": "", "reply_text_original": "Thank you so much for your heartfelt words, Sir! We’re happy to know you and your family had a wonderful experience with Dr. Shruti and the team at Rathi Dental Care. Your trust and recommendation mean a lot to us.\n\n– Team Rathi Dental Care", "reply_language": "en", "reply_posted_at_unix_micros": 1786348401000000, "reply_updated_at_unix_micros": 1786348401000000, "published_at": "2026-08-09T05:46:57.037069Z"}, {"Name": "Arja Deshmukh", "ProfilePicture": "https://lh3.googleusercontent.com/a-/ALV-UjW_rtsVpYNQi01Ka1OAkYAqeRF1UK2GCl5ExQVGOIHrOEuyVDAR=s120-c-rp-mo-br100", "Rating": 5, "Description": "I genuinely never thought I’d say this, but I’m actually going to miss going to the dentist. 🥹🦷\n\nA huge thank you to Dr. Shruti Rathi for making what could’ve been such a scary journey feel so comfortable and easy !!\nShe explained every single step of my treatment so patiently, guided me through everything, and never once made me feel hesitant to ask questions. There was never that intimidating “doctor” vibe—instead, every appointment felt warm, welcoming, and reassuring. One of my favorite things about my visits was how chatty and friendly she is! She somehow made every appointment enjoyable, and I’ll honestly miss our little conversations. I’ll also miss my cartoon sessions during the procedures—they became such a fun little part of the experience. 😂\nEven the anesthesia, which I was most nervous about, didn’t feel scary because she kept comforting me throughout. Having such a calm, kind, and positive doctor made all the difference.\nMy treatment wasn’t the easiest, but she made every step feel lighter. Now that everything is finally complete and the results are “perfect”, I’m beyond grateful. I never imagined I’d be sad about finishing a dental treatment, but I already miss our chats and her comforting presence.\nIf you’re looking for a dentist who’s incredibly skilled, patient, kind, friendly and genuinely cares about making you feel comfortable, I can’t recommend Dr. Shruti Rathi enough !!  Thank you for not just giving me a beautiful smile, but for making the entire journey such a positive and memorable one. ❤️", "Images": null, "When": "3 months ago", "review_id": "Ci9DQUlRQUNvZENodHljRjlvT2pWTGFIaHFURmx5YUc5M2QwVTJZMUIxZFZwQ2JFRRAB", "source": "Google", "rating_scale": 5, "rating_float": 5, "author_url": "https://www.google.com/maps/contrib/105889954578544157956/reviews?hl=en-GB", "posted_at_unix_micros": 1785337889995835, "updated_at_unix_micros": 1785337889995835, "language": "en", "translated_lang": "", "text_original": "I genuinely never thought I’d say this, but I’m actually going to miss going to the dentist. 🥹🦷\n\nA huge thank you to Dr. Shruti Rathi for making what could’ve been such a scary journey feel so comfortable and easy !!\nShe explained every single step of my treatment so patiently, guided me through everything, and never once made me feel hesitant to ask questions. There was never that intimidating “doctor” vibe—instead, every appointment felt warm, welcoming, and reassuring. One of my favorite things about my visits was how chatty and friendly she is! She somehow made every appointment enjoyable, and I’ll honestly miss our little conversations. I’ll also miss my cartoon sessions during the procedures—they became such a fun little part of the experience. 😂\nEven the anesthesia, which I was most nervous about, didn’t feel scary because she kept comforting me throughout. Having such a calm, kind, and positive doctor made all the difference.\nMy treatment wasn’t the easiest, but she made every step feel lighter. Now that everything is finally complete and the results are “perfect”, I’m beyond grateful. I never imagined I’d be sad about finishing a dental treatment, but I already miss our chats and her comforting presence.\nIf you’re looking for a dentist who’s incredibly skilled, patient, kind, friendly and genuinely cares about making you feel comfortable, I can’t recommend Dr. Shruti Rathi enough !!  Thank you for not just giving me a beautiful smile, but for making the entire journey such a positive and memorable one. ❤️", "text_translated": "", "reply_text_original": "This truly made me smile. ❤️ I know dental injections aren’t easy—I remember being scared of them during my school days too. So I always try my best to make that part as comfortable and stress-free as possible. It was such a pleasure being a part of your journey, and I’ll genuinely miss our little chats too. Thank you for trusting me with your smile n being so brave through out the trt. Wishing you endless reasons to keep smiling. 🤍\n\n- Team Rathi Dental Care\n", "reply_language": "en", "reply_posted_at_unix_micros": 1785341028000000, "reply_updated_at_unix_micros": 1785489119000000, "published_at": "2026-07-29T15:11:29.995835Z"}, {"Name": "Priyanka Mundhada", "ProfilePicture": "https://lh3.googleusercontent.com/a/ACg8ocJjzXr9i-IBhlts_mQVe0lG3sC4D9jAh1Y1mLS5IXQVXTZW8A=s120-c-rp-mo-ba12-br100", "Rating": 5, "Description": "Dr.Shruti is an amazing Dentist. Highly recommend her for your dental needs. Best dentist in Thane. Staff is polite and professional . I got my teeth cleaning done. Thankyou Dr.Shruti Rathi and entire team   of Rathi Dental Care", "Images": null, "When": "3 months ago", "review_id": "Ci9DQUlRQUNvZENodHljRjlvT2t3NVVFMWhMVTQ1VUVWT05UQktUM2w0UzA5VGRHYxAB", "source": "Google", "rating_scale": 5, "rating_float": 5, "author_url": "https://www.google.com/maps/contrib/101148267786306610192/reviews?hl=en-GB", "posted_at_unix_micros": 1785501244266457, "updated_at_unix_micros": 1785501244266457, "language": "en", "translated_lang": "", "text_original": "Dr.Shruti is an amazing Dentist. Highly recommend her for your dental needs. Best dentist in Thane. Staff is polite and professional . I got my teeth . I would highly recommend this clinic to anyone looking for knowledgeable, compassionate dentists who genuinely go above and beyond for  patients.\nI was quite insecure about my smile before the treatment but post-treatment I’ve been so pleased with the results that I’ve felt a lot more secure and happy with myself", "Images": null, "When": "3 months ago", "review_id": "Ci9DQUlRQUNvZENodHljRjlvT21oalFVNVpURFk0ZHpsM1pUWTBjMUJsVHkwdFZtYxAB", "source": "Google", "rating_scale": 5, "rating_float": 5, "author_url": "https://www.google.com/maps/contrib/101464239100713089482/reviews?hl=en-GB", "posted_at_unix_micros": 1784647336379999, "updated_at_unix_micros": 1784647336379999, "language": "en", "translated_lang": "", "text_original": "I had an excellent experience at Dentaland from start to finish.\nI flew in from London to Thane to visit this clinic because of the reviews and external referrals for Dr Ranjeet Sharma and Dr Bhavana Sharma. I had a full mouth smile designing procedure done.\nThey were incredibly professional and attentive throughout my treatment. They took the time to explain every step of the procedure, making me feel comfortable and well informed.\nIn addition to this, they were always on top of everything and even took the time to respond to my questions outside of office hours, which was highly appreciated. Their kindness, constant communication and attention to detail made the entire experience easy.\nThe procedure itself was carried out very well, and I am very pleased with the treatment I received. I would highly recommend this clinic to anyone looking for knowledgeable, compassionate dentists who genuinely go above and beyond for  patients.\nI was quite insecure about my smile before the treatment but post-treatment I’ve been so pleased with the results that I’ve felt a lot more secure and happy with myself", "text_translated": "", "reply_text_original": "Thank you so much for taking the time to share your incredible experience with us! Hearing how your Full Mouth Smile Designing procedure has given you newfound confidence and joy brings the deepest satisfaction to our entire team at Dentaland.\n\nTraveling all the way from London for comprehensive aesthetic care is a significant decision, and we are deeply honored that you placed your trust in us. In our 30 years of clinical practice, our 'patient-first' philosophy as proprietors has always been built on meticulous planning, clear communication, and round-the-clock support—especially for our international patients navigating a tight travel schedule.\nCombining artistic smile design principles with advanced digital technology allows us to deliver results that are not only aesthetically stunning, but also functionally lasting and achieved through a gentle, painless procedure journey.\n\nDr. Ranjeet, Dr. Bhavana, and our entire staff are so proud to have been a part of your transformation. Thank you for your high recommendation, and we look forward to welcoming you back whenever you visit Thane again!\n\nWarm regards,\n\nDr. Ranjeet, Dr. Bhavana & Team Dentaland\n\nProprietors, Dentaland - Dental Laser and Implant Centre (Gladys Alwares Road, Thane)\"", "reply_language": "en", "reply_posted_at_unix_micros": 1787156638000000, "reply_updated_at_unix_micros": 1787156638000000, "published_at": "2026-07-21T15:22:16.379999Z"}, {"Name": "Akash Roy", "ProfilePicture": "https://lh3.googleusercontent.com/a/ACg8ocLbDAeaRQy8nsY9tVV0jX36_K4n5amr_CsZMitTyTuk_zcW2A=s120-c-rp-mo-br100", "Rating": 5, "Description": "I had a really good experience at Dentaland, and this was actually my second time visiting them. I had consulted them back in 2024 as well, and since I had a good experience and benefited from the treatment at that time, I decided to come back to Dentaland again.\n\nRecently, I was having a persistent gum and dental issue while I was in Pune, and when it wasn’t getting better, I came back to Thane and consulted Dentaland. Dr. Bhavana Sharma Ma’am examined my condition very carefully, explained the issue and the treatment in a very clear and understandable way, and treated me with a lot of care and patience. I underwent deep cleaning along with laser treatment, and the entire procedure was done very professionally and thoroughly.\n\nWhat I really appreciate about Dentaland is that they don’t make you feel rushed or confused. Dr. Bhavana Ma’am took the time to properly understand and diagnose the problem, explained what was actually happening, and guided me through the treatment. Dr. Ranjeet Sharma Sir was also very approachable and took the time to speak with me and explain things properly. Both of them come across as very genuine, experienced and patient-focused.\n\nThe treatment was done extremely well, and I’m genuinely happy with the care I received. It feels good to know that even after a couple of years, I could come back to the same place and receive the same level of genuine care and attention.\n\nThank you, Dr. Bhavana Ma’am, Dr. Ranjeet Sir and the entire Dentaland team for taking such good care of me. I would definitely recommend Dentaland to anyone looking for a trustworthy and genuinely caring dental clinic in Thane.", "Images": null, "When": "a month ago", "review_id": "Ci9DQUlRQUNvZENodHljRjlvT2xSYVRTMXpOVVZJVG01dk1UUnNTRWhWTUdGVlptYxAB", "source": "Google", "rating_scale": 5, "rating_float": 5, "author_url": "https://www.google.com/maps/contrib/111415355759091303081/reviews?hl=en-GB", "posted_at_unix_micros": 1788619553853691, "updated_at_unix_micros": 1788619553853691, "language": "en", "translated_lang": "", "text_original": "I had a really good experience at Dentaland, and this was actually my second time visiting them. I had consulted them back in 2024 as well, and since I had a good experience and benefited from the treatment at that time, I decided to come back to Dentaland again.\n\nRecently, I was having a persistent gum and dental issue while I was in Pune, and when it wasn’t getting better, I came back to Thane and consulted Dentaland. Dr. Bhavana Sharma Ma’am examined my condition very carefully, explained the issue and the treatment in a very clear and understandable way, and treated me with a lot of care and patience. I underwent deep cleaning along with laser treatment, and the entire procedure was done very professionally and thoroughly.\n\nWhat I really appreciate about Dentaland is that they don’t make you feel rushed or confused. Dr. Bhavana Ma’am took the time to properly understand and diagnose the problem, explained what was actually happening, and guided me through the treatment. Dr. Ranjeet Sharma Sir was also very approachable and took the time to speak with me and explain things properly. Both of them come across as very genuine, experienced and patient-focused.\n\nThe treatment was done extremely well, and I’m genuinely happy with the care I received. It feels good to know that even after a couple of years, I could come back to the same place and receive the same level of genuine care and attention.\n\nThank you, Dr. Bhavana Ma’am, Dr. Ranjeet Sir and the entire Dentaland team for taking such good care of me. I would definitely recommend Dentaland to anyone looking for a trustworthy and genuinely caring dental clinic in Thane.", "text_translated": "", "reply_text_original": "Dear Akash,\n\nThank you so much for taking the time to write such a detailed and heartwarming review!\n\nWelcoming you back to Dentaland after your first visit in 2024 means the world to us. Knowing that you chose to travel from Pune to Thane specifically to seek treatment with us is the highest compliment our team could receive.\n\nDr. Bhavana, Dr. Ranjeet, and our entire team are delighted to know that your deep cleaning and laser treatment brought you complete relief. We strongly believe that clear communication, patience, and genuine care are just as important as technical precision, so hearing that you felt heard, comfortable, and never rushed is extremely rewarding for us.\n\nThank you for your continued trust over the years and for your strong recommendation to the Thane community. We are always here whenever you need us—wishing you lasting oral health and a great smile!\n\nWarm regards,\n\nDr. Ranjeet Sharma, Dr. Bhavana Sharma & Team Dentaland\n\nGladys Alwares Road, Thane (W)", "reply_language": "en", "reply_posted_at_unix_micros": 1788881741000000, "reply_updated_at_unix_micros": 1788881741000000, "published_at": "2026-09-05T14:45:53.853691Z"}, {"Name": "Vishal Tiwari", "ProfilePicture": "https://lh3.googleusercontent.com/a-/ALV-UjWGWFw1P4utd9XAYYJvE-aBxWDzkaHDGtv4tgECvHml3tHhu9YI=s120-c-rp-mo-br100", "Rating": 5, "Description": "I have always been afraid of medical procedures, so I was quite nervous about my root canal treatment. But Dr. Ranjeet and Dr. Bhavana explained everything patiently and made me feel comfortable throughout the treatment.\n\nTheir gentle behaviour, patience, and care helped me overcome my fear. Thanks to them, I now feel much more confident about medical procedures. Truly grateful for the wonderful experience. Highly recommended!", "Images": null, "When": "a month ago", "review_id": "Ci9DQUlRQUNvZENodHljRjlvT2xkd1RXMUpOM2hzVmtkclkzcE5jRGRwYUhSaFZrRRAB", "source": "Google", "rating_scale": 5, "rating_float": 5, "author_url": "https://www.google.com/maps/contrib/114415112495166704154/reviews?hl=en-GB", "posted_at_unix_micros": 1788581457138634, "updated_at_unix_micros": 1788581457138634, "language": "en", "translated_lang": "", "text_original": "I have always been afraid of medical procedures, so I was quite nervous about my root canal treatment. But Dr. Ranjeet and Dr. Bhavana explained everything patiently and made me feel comfortable throughout the treatment.\n\nTheir gentle behaviour, patience, and care helped me overcome my fear. Thanks to them, I now feel much more confident about medical procedures. Truly grateful for the wonderful experience. Highly recommended!", "text_translated": "", "reply_text_original": "Dear Vishal Sir\n\nThank you so much for taking the time to share your review!\n\nOvercoming a fear of dental procedures is a huge step, and we are so proud of you for completing your root canal treatment. For Dr. Ranjeet, Dr. Bhavana, and our entire team at Dentaland, helping nervous patients feel safe, heard, and comfortable is at the very heart of what we do. Hearing that your experience not only gave you a healthy smile but also boosted your confidence for future care is the greatest reward we could ask for.\n\nThank you for trusting us with your care and for recommending us to the Thane community. We are always here to keep your smile healthy and fear-free!\n\nWarm regards,\n\nDr. Ranjeet Sharma, Dr. Bhavana Sharma & Team Dentaland\n\nGladys Alwares Road, Thane (W)", "reply_language": "en", "reply_posted_at_unix_micros": 1788881883000000, "reply_updated_at_unix_micros": 1788881883000000, "published_at": "2026-09-05T04:10:57.138634Z"}, {"Name": "Vivek Ghule", "ProfilePicture": "https://lh3.googleusercontent.com/a-/ALV-UjUKLbperEDWOUd599Q_lRtYlXcXVopX5taT2guChYtlfRTqlkM=s120-c-rp-mo-br100", "Rating": 5, "Description": "After a failed wisdom tooth extraction at some other place,  I was lucky to get the right treatment on time, all thanks to dr. Sharma and team.\nBoth Dr.Sharma ma'am and sir are highly experienced and very professional at their job. I have never experienced such good post treatment follow up care in my life. Dr. Sharma ma'am and sir are too good. Pls keep up the good work 💐👍", "Images": null, "When": "2 months ago", "review_id": "Ci9DQUlRQUNvZENodHljRjlvT21wWmFrbGtjMVE1VXpGT1RHWk1aV2RsY3pCalowRRAB", "source": "Google", "rating_scale": 5, "rating_float": 5, "author_url": "https://www.google.com/maps/contrib/112974843077643775733/reviews?hl=en-GB", "posted_at_unix_micros": 1788115177692274, "updated_at_unix_micros": 1788115177692274, "language": "en", "translated_lang": "", "text_original": "After a failed wisdom tooth extraction at some other place,  I was lucky to get the right treatment on time, all thanks to dr. Sharma and team.\nBoth Dr.Sharma ma'am and sir are highly experienced and very professional at their job. I have never experienced such good post treatment follow up care in my life. Dr. Sharma ma'am and sir are too good. Pls keep up the good work 💐👍", "text_translated": "", "reply_text_original": "Thank you so much for your kind words and the lovely flowers! We are honestly just so relieved we could help put things right for you after such a stressful experience with your wisdom tooth earlier.\n\nComing in after a failed attempt elsewhere takes a lot of courage, and we know how terrifying that can be. In our 30 years as doctors, our biggest priority at Dentaland has always been to make sure our patients feel safe and truly cared for—not just while sitting in the clinic chair, but all through their recovery at home.\n\nKnowing that our post-treatment care made such a positive difference for you means the absolute world to us. Thank you for putting your trust in Dr. Ranjeet, Dr. Bhavana, and our team here on Gladys Alwares Road. We’re always here whenever you need us!\n\nWarmly,\n\nDr. Ranjeet, Dr. Bhavana & Team Dentaland\n\nProprietors, Dentaland - Dental Laser and Implant Centre (Thane)\"", "reply_language": "en", "reply_posted_at_unix_micros": 1788415311000000, "reply_updated_at_unix_micros": 1788415311000000, "published_at": "2026-08-30T18:39:37.692274Z"}, {"Name": "Shruti Ghag", "ProfilePicture": "https://lh3.googleusercontent.com/a-/ALV-UjX4XoXiZ6rS7ddcAMkD2Ffqyg4d1OFDQ6hNWvmE6cRhFJq_aXQ4qA=s120-c-rp-mo-br100", "Rating": 5, "Description": "I recently underwent a dental implant procedure at Dentland, and I am extremely happy with my experience.\n\nA special thanks to Dr. Bhavana Sharma and Mr. Ranjeet Sharma for guiding me through every step of the process so patiently and thoroughly. They explained everything in detail—from the extraction and bone placement to the implant pro tsApp%20consultation%20button%20to%20ask%20quick%20questions%2C%20causing%20potential%20inquiries%20to%20drop%20off.%0A%0AWe%20set%20up%20a%20simple%201-tap%20WhatsApp%20automated%20booking%20system%20for%20Thane%20practices%20that%20captures%20inquiries%2024/7%20without%20changing%20your%20current%20setup.%0A%0ACan%20I%20send%20you%20a%20quick%2030-second%20preview%20of%20how%20it%20looks%3F"}];

        function renderLeads(list) {
            const grid = document.getElementById('leadsGrid');
            if (list.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 40px;">No leads matching filters.</p>';
                return;
            }

            grid.innerHTML = list.map((lead, idx) => {
                const isHot = lead.opportunity_score >= 75;
                const badgeClass = isHot ? 'badge-hot' : 'badge-warm';
                const badgeText = isHot ? `🔥 HOT (${lead.opportunity_score})` : `⚡ WARM (${lead.opportunity_score})`;
                const gapsHtml = (lead.digital_gaps || []).map(g => `<div class="gap-pill">⚠️ ${g}</div>`).join('');
                
                const waBtn = lead.wa_outreach_link 
                    ? `<a href="${lead.wa_outreach_link}" target="_blank" class="btn btn-card btn-whatsapp">📲 Open Pitch</a>`
                    : `<span class="btn btn-card btn-secondary" style="opacity:0.6; cursor:not-allowed;">No Mobile</span>`;

                return `
                    <div class="lead-card">
                        <div>
                            <div class="card-top">
                                <h3 class="lead-title">${lead.title}</h3>
                                <span class="badge ${badgeClass}">${badgeText}</span>
                            </div>
                            <div class="meta-row">
                                <span class="rating-badge">⭐ ${lead.rating || '0.0'}</span>
                                <span>💬 ${lead.reviews_count || 0} reviews</span>
                                <span>📞 ${lead.phone || 'No phone'}</span>
                            </div>
                            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">
                                📍 ${lead.address || 'Local Area'}
                            </p>
                            <div class="gaps-container">
                                ${gapsHtml}
                            </div>
                        </div>
                        <div class="card-actions">
                            ${waBtn}
                            <button class="btn btn-card btn-secondary" onclick="copyPitch(${idx})">📋 Copy Pitch</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterCards() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const tier = document.getElementById('tierFilter').value;
            const web = document.getElementById('webFilter').value;

            const filtered = leads.filter(l => {
                const matchSearch = (l.title || '').toLowerCase().includes(search) ||
                                    (l.address || '').toLowerCase().includes(search) ||
                                    (l.digital_gaps || []).some(g => g.toLowerCase().includes(search));
                
                const matchTier = tier === 'ALL' || l.priority_tier === tier;
                
                let matchWeb = true;
                if (web === 'NO_WEB') matchWeb = !l.website;
                if (web === 'HAS_WEB') matchWeb = !!l.website;

                return matchSearch && matchTier && matchWeb;
            });

            renderLeads(filtered);
        }

        function copyPitch(index) {
            const lead = leads[index];
            if (lead && lead.pitch_message) {
                navigator.clipboard.writeText(lead.pitch_message).then(() => {
                    showToast();
                });
            }
        }

        function showToast() {
            const t = document.getElementById('toast');
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2500);
        }

        // Initial render
        renderLeads(leads);
    </script>
