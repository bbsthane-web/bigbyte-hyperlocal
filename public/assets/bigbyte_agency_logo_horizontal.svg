<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="neonPulseWide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glowWide">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="900" height="240" rx="20" fill="#0b1120" stroke="#1e293b" stroke-width="2" />

  <!-- Left Icon Emblem (Hex Shield with BB Circuit) -->
  <g transform="translate(40, 20)">
    <polygon points="100,10 180,55 180,145 100,190 20,145 20,55" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="3" filter="url(#glowWide)" />
    
    <!-- Monogram Inside Shield -->
    <path d="M 75 60 L 105 60 L 105 140 L 75 140 Z" fill="url(#cyanGrad)" />
    <path d="M 105 60 C 130 60, 145 70, 145 88 C 145 102, 132 108, 115 110" fill="none" stroke="#38bdf8" stroke-width="9" stroke-linecap="round" />
    <path d="M 112 110 C 135 112, 150 120, 150 135 C 150 148, 130 140, 105 140" fill="none" stroke="#06b6d4" stroke-width="9" stroke-linecap="round" />
    <circle cx="100" cy="50" r="3.5" fill="#38bdf8" />
    <line x1="100" y1="50" x2="100" y2="60" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Divider Line -->
  <line x1="270" y1="45" x2="270" y2="195" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Typography Right Side -->
  <g transform="translate(305, 0)">
    <!-- Primary Title -->
    <text x="0" y="105" font-family="'Inter', 'Segoe UI', 'Montserrat', sans-serif" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="3">
      BIG BYTE
    </text>
    
    <!-- Subtitle Agency -->
    <text x="0" y="150" font-family="'Inter', 'Segoe UI', 'Montserrat', sans-serif" font-size="24" font-weight="700" fill="url(#cyanGrad)" letter-spacing="8">
      SYSTEMS AGENCY
    </text>

    <!-- Tagline Badge -->
    <rect x="0" y="172" width="280" height="26" rx="6" fill="#0284c7" opacity="0.15" />
    <text x="12" y="190" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="2">
      AUTONOMOUS AI &amp; MEDIA OS
    </text>
  </g>
</svg>
