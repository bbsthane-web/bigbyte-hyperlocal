<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    
    <!-- Neon Cyan & Electric Blue Metallic Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="neonPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Slate Outer Badge Circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="4" />

  <!-- Outer Cyber Orbit Ring with Dash Pattern -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="16 8 4 8" opacity="0.4" />
  
  <!-- Subtle Internal Hexagon Grid Guides -->
  <polygon points="256,40 442,148 442,364 256,472 70,364 70,148" fill="none" stroke="#334155" stroke-width="1.2" opacity="0.35" stroke-dasharray="6 6" />

  <!-- Center Glow Orb Behind Logo -->
  <circle cx="256" cy="256" r="110" fill="#0284c7" opacity="0.12" filter="url(#outerGlow)" />

  <!-- Stylized Geometric "BB" (Big Byte) Monogram -->
  <g transform="translate(14, 0)">
    <!-- Primary Left Pillar (B spine) -->
    <path d="M 170 140 L 225 140 L 225 372 L 170 372 Z" fill="url(#neonCyan)" filter="url(#glowEffect)" />
    
    <!-- Top Circuit Nodes on Spine -->
    <circle cx="197" cy="120" r="5" fill="#38bdf8" />
    <line x1="197" y1="120" x2="197" y2="140" stroke="#38bdf8" stroke-width="3" />

    <!-- Upper Loop of First B (Data Flow Wave) -->
    <path d="M 225 140 C 275 140, 310 160, 310 200 C 310 235, 280 252, 240 254" fill="none" stroke="url(#accentGlow)" stroke-width="20" stroke-linecap="round" />

    <!-- Lower Loop of Second B (Connected Neural Arch) -->
    <path d="M 235 258 C 290 260, 325 280, 325 320 C 325 365, 280 372, 225 372" fill="none" stroke="url(#neonPulse)" stroke-width="20" stroke-linecap="round" filter="url(#glowEffect)" />

    <!-- Circuit Intersecting Traces & Micro Nodes -->
    <polyline points="205,256 140,256 120,280" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="120" cy="280" r="6" fill="#22d3ee" filter="url(#glowEffect)" />

    <polyline points="225,170 145,170" fill="none" stroke="#0ea5e9" stroke-width="2.5" />
    <circle cx="145" cy="170" r="4.5" fill="#0ea5e9" />

    <polyline points="225,340 155,340 135,315" fill="none" stroke="#0ea5e9" stroke-width="2.5" />
    <circle cx="135" cy="315" r="4.5" fill="#0ea5e9" />
  </g>

  <!-- Accent Corner Precision Markers -->
  <path d="M 90 90 L 115 90 M 90 90 L 90 115" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <path d="M 422 90 L 397 90 M 422 90 L 422 115" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <path d="M 90 422 L 115 422 M 90 422 L 90 397" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <path d="M 422 422 L 397 422 M 422 422 L 422 397" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7" />

  <!-- Sub-Arc Typographic Badge Label: BIG BYTE SYSTEMS AGENCY -->
  <text x="256" y="440" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#94a3b8" letter-spacing="7" text-anchor="middle">
    BIG BYTE SYSTEMS
  </text>
  <text x="256" y="458" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#38bdf8" letter-spacing="4" text-anchor="middle">
    AI &amp; MEDIA AGENCY
  </text>
</svg>
