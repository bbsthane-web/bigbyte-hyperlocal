name: 24/7 Autonomous Social Autopilot

on:
  schedule:
    # Runs every 30 minutes, 24 hours a day, 365 days a year (100% Free on GitHub Actions)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Allows manual 1-click trigger from GitHub web interface

permissions:
  contents: write

jobs:
  dispatch-posts:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🎬 Verify FFmpeg
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: 📦 Install Node Dependencies
        run: |
          cd social_studio
          npm install --omit=dev --no-save

      - name: 🚀 Run Autonomous Cloud Dispatcher
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ACCOUNT_ID: ${{ secrets.META_IG_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          cd social_studio
          node scripts/cloud_dispatcher.js

      - name: 💾 Commit & Push Published Status
        run: |
          git config --global user.name "SocialStudioAutopilot[bot]"
          git config --global user.email "autopilot@bigbytesystems.co.in"
          git add social_studio/data/posts.json social_studio/public/assets/reels/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            echo "Publish updates detected. Committing and pushing to repository..."
            git commit -m "🤖 [Autopilot] Published scheduled posts & synced Reels [skip ci]"
            git push || echo "⚠️ Git push to origin skipped (updates preserved in cloud cycle)"
          else
            echo "✅ All scheduled posts up to date. Zero database changes in this cycle."
          fi
